<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="遊戲樂園">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#6cd3ff">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>小小遊戲樂園</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="home-page">
<div class="sky" aria-hidden="true"><i class="cloud k1"></i><i class="cloud k2"></i><i class="cloud k3"></i></div>
<header class="hero">
  <img class="logo" src="assets/bunny/hero_stand.png" alt="">
  <div class="hero-text">
    <h1>小小遊戲樂園</h1>
    <p class="tag">沒有廣告・不用網路・安心玩</p>
  </div>
</header>

<nav id="cats" class="cats"></nav>
<main id="grid" class="grid"></main>

<footer class="foot">
  <p>給家長：本站沒有任何廣告、追蹤或外部連結，遊戲紀錄只存在這台裝置上。</p>
  <p>遊戲美術素材：Kenney.nl（CC0 公眾領域授權）。</p>
  <p>在 Safari 按「分享 → 加入主畫面」，就能像 App 一樣全螢幕開啟。</p>
</footer>

<script src="js/games.js"></script>
<script>
(function () {
  'use strict';
  var cats = document.getElementById('cats'), grid = document.getElementById('grid');
  var cur = 'all';
  try { cur = localStorage.getItem('gg_cat') ? JSON.parse(localStorage.getItem('gg_cat')) : 'all'; } catch (e) { cur = 'all'; }
  if (!GG.CATS.some(function (c) { return c.id === cur; })) cur = 'all';

  function played(id) {
    try {
      for (var d = 0; d < 3; d++) if (localStorage.getItem('gg_best_' + id + '_' + d) !== null) return true;
    } catch (e) { /* 忽略 */ }
    return false;
  }

  function render() {
    cats.innerHTML = '';
    GG.CATS.forEach(function (c) {
      var b = document.createElement('button');
      var col = c.id === 'all' ? '#ff5c8a' : c.color;
      b.className = 'cat' + (c.id === cur ? ' on' : '');
      if (c.id === cur) b.style.background = col;
      var dot = document.createElement('span');
      dot.className = 'dot'; dot.style.background = col;
      b.appendChild(dot);
      b.appendChild(document.createTextNode(c.name));
      b.addEventListener('click', function () {
        cur = c.id;
        try { localStorage.setItem('gg_cat', JSON.stringify(cur)); } catch (e) { /* 忽略 */ }
        render();
      });
      cats.appendChild(b);
    });
    grid.innerHTML = '';
    var n = 0;
    GG.GAMES.forEach(function (g) {
      if (cur !== 'all' && g.cat !== cur) return;
      var a = document.createElement('a');
      // 大格（2x2）與寬格（2x1）穿插：22 款剛好排滿 4 欄或 6 欄，不留空洞
      var size = cur !== 'all' ? (n === 0 ? ' big' : '') : [0, 6, 12, 17].indexOf(n) >= 0 ? ' big' : [1, 18].indexOf(n) >= 0 ? ' wide' : '';
      a.className = 'tile' + size;
      a.href = 'game.html?g=' + g.id;
      a.style.animationDelay = (n * 0.03) + 's';
      n++;
      var e = document.createElement('img'); e.className = 'tile-img'; e.src = 'assets/covers/' + g.id + '.jpg'; e.alt = '';
      var nm = document.createElement('div'); nm.className = 'tile-name'; nm.textContent = g.name;
      var d = document.createElement('span'); d.className = 'tile-desc'; d.textContent = g.desc;
      nm.appendChild(d);
      a.appendChild(e); a.appendChild(nm);
      if (g.players) {
        var pb = document.createElement('span'); pb.className = 'badge duo'; pb.textContent = g.players; a.appendChild(pb);
      } else if (g.cat === 'duo') {
        var t = document.createElement('span'); t.className = 'badge duo'; t.textContent = '雙人'; a.appendChild(t);
      } else if (played(g.id)) {
        var p = document.createElement('span'); p.className = 'badge done'; p.textContent = '玩過'; a.appendChild(p);
      }
      grid.appendChild(a);
    });
  }
  render();
})();
</script>
<script src="js/sw-register.js"></script>
</body>
</html>
